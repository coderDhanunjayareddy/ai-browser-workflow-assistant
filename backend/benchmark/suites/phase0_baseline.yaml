name: phase0_baseline
description: >
  Frozen Phase 0 representative baseline. The explicit task list prevents new scenarios
  from silently changing the denominator. It contains deterministic fixtures, public
  no-auth sites, authenticated applications, file transfer, multi-tab, cross-site, and
  first-10 product workflows. Missing auth is recorded as SKIPPED, never as success.
